<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seismic PFP Generator Pro</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game-container {
    width: 100vw;
    height: 100vh;
    background: url('anh2.png') center/cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
}

#welcome-screen {
    position: absolute;
    z-index: 100;
    background: rgba(0,0,0,0.9);
    padding: 50px;
    border-radius: 16px;
    text-align: center;
    color: white;
    border: 2px solid #a442f5;
    box-shadow: 0 0 20px #a442f5;
}

button {
    padding: 14px 40px;
    background: #a442f5;
    border: none;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
}

#generator-ui {
    display: none;
    flex-direction: column;
    align-items: center;
}

#pfp-wrapper {
    position: relative;
    width: 500px;
    height: 700px;
    min-width: 500px;
    min-height: 700px;
    max-width: 500px;
    max-height: 700px;
}

/* Ảnh người dùng */
#user-image-container {
    position: absolute;
    width: 380px;
    height: 380px;
    top: 60px;
    left: 60px;
    z-index: 1;
    cursor: move;
    display: none;
    pointer-events: auto;
}

#user-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1);
}

/* Resizer */
.resizer {
    width: 14px;
    height: 14px;
    background: #00ffcc;
    border-radius: 50%;
    border: 2px solid #fff;
    position: absolute;
    z-index: 5;
}
.tl { top: -7px; left: -7px; cursor: nwse-resize; }
.tr { top: -7px; right: -7px; cursor: nesw-resize; }
.bl { bottom: -7px; left: -7px; cursor: nesw-resize; }
.br { bottom: -7px; right: -7px; cursor: nwse-resize; }

/* Khung PFP */
#pfp-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
}

/* Text overlay – CĂN BẰNG PX */
.input-overlay {
    position: absolute;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    line-height: 1.2;
    z-index: 10;
    pointer-events: auto; /* ⭐ BẮT BUỘC */
}

/* TOẠ ĐỘ CHUẨN THEO anh1.png */
#input-name {
    left: 100px;
    top: 525px;
    width: 200px;
	
    font-family: 'Orbitron', sans-serif;
    font-size: 26px;
    letter-spacing: 1.5px;
}

#input-magnitude {
    left: 200px;
    top: 570px;
    width: 120px;
	
	font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
}

#controls {
    margin-top: 15px;
    background: rgba(0,0,0,0.85);
    padding: 15px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}
.upload-btn {
    padding: 14px 40px;
    background: #a442f5;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    border-radius: 8px;
    text-align: center;
    user-select: none;
    box-shadow: 0 0 12px rgba(164,66,245,0.6);
    font-family: 'Orbitron', sans-serif;
}

.upload-btn:hover {
    background: #c066ff;
}
</style>
</head>

<body>

<audio id="bg-music" loop>
    <source src="nhac.mp3" type="audio/mpeg">
</audio>

<div id="game-container">

<div id="welcome-screen">
    <h1>SEISMIC PFP GENERATOR</h1>
    <button onclick="startGame()">START GAME</button>
</div>

<div id="generator-ui">

<div id="pfp-wrapper">

    <div id="user-image-container">
        <img id="user-image">
        <div class="resizer br"></div>
    </div>

    <img id="pfp-frame" src="anh1.png">

    <div id="input-name" class="input-overlay" contenteditable="true"></div>
    <div id="input-magnitude" class="input-overlay" contenteditable="true"></div>

</div>

<div id="controls">
    <input type="file" id="upload-pfp" accept="image/*" hidden>

    <label for="upload-pfp" class="upload-btn">
        UPLOAD YOUR PFP
    </label>

    <button onclick="downloadImage()">DOWNLOAD PFP</button>
</div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const music = document.getElementById('bg-music');
music.volume = 0.25;

function startGame(){
    document.getElementById('welcome-screen').style.display='none';
    document.getElementById('generator-ui').style.display='flex';
    music.play().catch(()=>{});
}

/* Upload ảnh – SET SIZE CHUẨN */
const upload = document.getElementById('upload-pfp');
const container = document.getElementById('user-image-container');
const img = document.getElementById('user-image');

upload.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        img.src = ev.target.result;
        container.style.display = 'block';
        container.style.width = '390px';
        container.style.height = '465px';
        container.style.left = '53px';
        container.style.top = '42px';
    };
    reader.readAsDataURL(file);
};

/* Drag & Resize */
let drag=false, resize=false, sx, sy, sw, sh, sl, st, h;

container.onmousedown = e=>{
    if(e.target.tagName === 'INPUT') return; // ⭐ QUAN TRỌNG

    sx=e.clientX; sy=e.clientY;
    sw=container.offsetWidth; sh=container.offsetHeight;
    sl=container.offsetLeft; st=container.offsetTop;

    if(e.target.classList.contains('resizer')){
        resize=true; h=e.target;
    } else drag=true;
};

window.onmousemove = e=>{
    if(drag){
        container.style.left = sl + e.clientX - sx + 'px';
        container.style.top  = st + e.clientY - sy + 'px';
    }
    if(resize){
        const dx=e.clientX-sx, dy=e.clientY-sy;
        if(h.classList.contains('br')){
            container.style.width=sw+dx+'px';
            container.style.height=sh+dy+'px';
        }
    }
};

window.onmouseup=()=>{drag=false; resize=false};

function downloadImage(){
    document.querySelectorAll('.resizer').forEach(r=>r.style.display='none');

    html2canvas(document.getElementById('pfp-wrapper'), {
        backgroundColor: null,
        scale: 1,
        useCORS: true,
    }).then(c=>{
        const a=document.createElement('a');
        a.download='Seismic_PFP.png';
        a.href=c.toDataURL('image/png');
        a.click();
        document.querySelectorAll('.resizer').forEach(r=>r.style.display='block');
    });
}
</script>

</body>
</html>
