<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seismic PFP Generator Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            background: url('anh2.png') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #welcome-screen {
            position: absolute;
            z-index: 100;
            background: rgba(10, 5, 20, 0.95);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            color: white;
            border: 2px solid #a442f5;
            box-shadow: 0 0 30px #a442f5;
        }

        button {
            padding: 15px 45px;
            background: #a442f5;
            border: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        button:hover {
            background: #ca82ff;
            transform: scale(1.05);
        }

        #generator-ui {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        /* KHU VỰC CHỤP ẢNH - Cố định kích thước chuẩn */
        #pfp-wrapper {
            position: relative;
            width: 500px;
            height: 700px;
            background: #111;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            overflow: hidden; /* Cắt phần thừa của ảnh user */
        }

        /* Lớp 1: Ảnh người dùng */
        #user-image-container {
            position: absolute;
            width: 390px;
            height: 465px;
            top: 42px;
            left: 53px;
            z-index: 1;
            cursor: move;
            display: none;
        }

        #user-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Lớp 2: Khung PFP (Trong suốt ở giữa) */
        #pfp-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 500px;
            height: 700px;
            z-index: 2;
            pointer-events: none; /* Để có thể click xuyên qua khung vào ảnh user */
        }

        /* Lớp 3: Chữ gõ trực tiếp */
        .input-overlay {
            position: absolute;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            z-index: 10;
            white-space: nowrap;
            text-transform: uppercase;
        }

        #input-name {
            left: 110px;
            top: 535px;
            width: 250px;
            font-size: 26px;
            letter-spacing: 2px;
        }

        #input-magnitude {
            left: 215px;
            top: 588px;
            width: 150px;
            font-size: 24px;
            letter-spacing: 1px;
        }

        /* Nút điều khiển bên dưới */
        #controls {
            margin-top: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            align-items: center;
            border: 1px solid #333;
        }

        .upload-btn {
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #aaa;
        }

        /* Điểm thu phóng */
        .resizer {
            width: 16px;
            height: 16px;
            background: #a442f5;
            border: 2px solid white;
            position: absolute;
            right: -8px;
            bottom: -8px;
            z-index: 15;
            cursor: nwse-resize;
            border-radius: 50%;
        }
    </style>
</head>

<body>

<audio id="bg-music" loop>
    <source src="nhac.mp3" type="audio/mpeg">
</audio>

<div id="game-container">
    <div id="welcome-screen">
        <h1 style="letter-spacing: 5px;">SEISMIC PFP</h1>
        <p style="color: #888; margin-bottom: 30px;">GENERATOR PRO V1.0</p>
        <button onclick="startGame()">START GENERATOR</button>
    </div>

    <div id="generator-ui">
        <div id="pfp-wrapper">
            <div id="user-image-container">
                <img id="user-image">
                <div class="resizer" id="resizer"></div>
            </div>

            <img id="pfp-frame" src="anh1.png">

            <div id="input-name" class="input-overlay" contenteditable="true" spellcheck="false">PLAYER_NAME</div>
            <div id="input-magnitude" class="input-overlay" contenteditable="true" spellcheck="false">9.9</div>
        </div>

        <div id="controls">
            <input type="file" id="upload-pfp" accept="image/*" hidden>
            <label for="upload-pfp" class="upload-btn">CHANGE IMAGE</label>
            <button onclick="downloadImage()">DOWNLOAD IMAGE</button>
        </div>
        <p style="color: #555; font-size: 11px; margin-top: 10px;">Drag to Move • Resize Circle to Scale • Click Text to Type</p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const music = document.getElementById('bg-music');
const upload = document.getElementById('upload-pfp');
const container = document.getElementById('user-image-container');
const img = document.getElementById('user-image');
const resizer = document.getElementById('resizer');

function startGame(){
    document.getElementById('welcome-screen').style.display='none';
    document.getElementById('generator-ui').style.display='flex';
    music.volume = 0.25;
    music.play().catch(()=>{});
}

/* Xử lý Upload */
upload.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        img.src = ev.target.result;
        container.style.display = 'block';
    };
    reader.readAsDataURL(file);
};

/* Drag & Resize System */
let isDragging = false, isResizing = false;
let startX, startY, startWidth, startHeight, startLeft, startTop;

// Bắt đầu sự kiện
document.addEventListener('mousedown', e => {
    if(e.target === resizer) {
        isResizing = true;
        startX = e.clientX;
        startY = e.clientY;
        startWidth = container.offsetWidth;
        startHeight = container.offsetHeight;
        e.preventDefault();
    } else if (e.target === img) {
        isDragging = true;
        startX = e.clientX - container.offsetLeft;
        startY = e.clientY - container.offsetTop;
        e.preventDefault();
    }
});

// Xử lý di chuyển
document.addEventListener('mousemove', e => {
    if(isDragging) {
        container.style.left = (e.clientX - startX) + 'px';
        container.style.top = (e.clientY - startY) + 'px';
    }
    if(isResizing) {
        const width = startWidth + (e.clientX - startX);
        const height = startHeight + (e.clientY - startY);
        if(width > 50) container.style.width = width + 'px';
        if(height > 50) container.style.height = height + 'px';
    }
});

document.addEventListener('mouseup', () => {
    isDragging = false;
    isResizing = false;
});

/* DOWNLOAD HÀM QUAN TRỌNG */
function downloadImage(){
    // 1. Tạm ẩn Resizer để không bị dính vào ảnh tải về
    resizer.style.opacity = '0';
    
    const wrapper = document.getElementById('pfp-wrapper');

    // 2. Sử dụng html2canvas với cấu hình cao nhất
    html2canvas(wrapper, {
        backgroundColor: null,
        scale: 2, // Tăng độ nét gấp đôi
        useCORS: true, // Cho phép load ảnh từ nguồn khác nếu có
        allowTaint: true,
        logging: false,
        width: 500,
        height: 700
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'Seismic_PFP_Export.png';
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
        
        // 3. Hiện lại Resizer sau khi chụp xong
        resizer.style.opacity = '1';
    });
}
</script>

</body>
</html>
